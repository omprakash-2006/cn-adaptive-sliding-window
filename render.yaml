services:
  - type: web
    name: cn-campus-results-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: python -m compileall -q .
    startCommand: python -u hosted_launch.py
    healthCheckPath: /healthz
    envVars:
      - key: PYTHONDONTWRITEBYTECODE
        value: "1"
      - key: PYTHONUNBUFFERED
        value: "1"
